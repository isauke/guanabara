<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="midia.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">

            <div id="imagem">
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo novamente.</p>

                <form action="login.php" method="post" autocomplete="on">

                    <div class="campo">
                        <span class="material-symbols-outlined">email</span>
                        <input type="email" name="email" id="iemail" placeholder="Seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="ilogin">Login: </label>

                    </div>
                    <div class="campo">

                        <span class="material-symbols-outlined">password</span>
                        <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password"
                        required minlength="8" maxlength="30">
                        <label for="isenha">Senha: </label>

                    </div>
                    <input type="submit" value="Entrar">
                    <a class="botao" href="#">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>

                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
