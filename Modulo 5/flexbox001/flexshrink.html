<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando flex shrink</title>
    <style>
        body{
            width: 98vw;
            height: 100vh;
            background-color: rgb(6, 41, 41);
        }
        article{
            margin: auto;
            display: flex;
            width: 50vw;
            height: 50vh;
            background-color: bisque;
            flex-flow: nowrap;
        }
        #div1,#div2,#div3{
            flex-basis: 150px;
            height: 15vw;
        }
        #div1{
            flex: 1 1 150px;
            background-color: brown;
        }
        #div2{
            flex: 2 4 150px;
            background-color: chocolate;
        }
        #div3{
            flex: 1 2 150px;
            background-color: darkgoldenrod;
        }
    </style>
</head>
<body>
    <article>
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
    </article>
</body>
</html>
