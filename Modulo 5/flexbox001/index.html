<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box pela primeira vez</title>
    <style>
        div{
            display: flex;
            background-color: darkblue;
            width: 100px;
            flex-flow: row wrap;
            align-items: start;
            height: 400px;
            
            
        }
        h3{
            background-color: rgb(148, 148, 214);
            border: 1px black solid;
            margin: 5px;
            padding:5px;
            text-align:center;
            max-width: 50px;
        }
    </style>
</head>
<body>
    <div>
        <h3>A</h3>
        <h3>B</h3>
        <h3>C</h3>
        <h3>D</h3>
        <h3>E</h3>
    </div>
</body>
</html>
