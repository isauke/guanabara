<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border: 1px black solid;
            border-collapse: collapse;
        }
        td,th{
            text-align: center;
            vertical-align: center;
            border: 1px black solid;
            padding: 10px;
            width: 100px;

        }
        .alingleft{
            text-align: left;
        }
        th,.alingleft,.nums{
            background-color: gray;
            color: rgb(233, 232, 232);
        }
        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2"><strong>Área</strong></th>
                <th rowspan="2"><strong>Disciplina</strong></th>
                <th colspan="2"><strong>Notas</strong></th>
                <th rowspan="2"><strong>Média</strong></th>
            </tr>
            <tr>
                <th><strong>Nota 1</strong></th>
                <th><strong>Nota 2</strong></th>
                
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4"><strong>Exátas</strong></td>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="alingleft"><strong>Média de Exatas</strong></td>
                <td class="nums">0.0</td>
            </tr>
            <tr>
                <td rowspan="2"><strong>Humanas</strong></td>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="alingleft"><strong>Média de Humanas</strong></td>
                <td class="nums">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
